# Fly.io config. Change `app` to a unique name before `fly launch --copy-config`.
app = "arblab"
primary_region = "lhr"

[env]
  NODE_ENV = "production"
  DATABASE_PATH = "/data/arblab.db"

# The SQLite file lives on this volume. SQLite means exactly one machine.
[[mounts]]
  source = "arblab_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
